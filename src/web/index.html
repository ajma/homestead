<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homestead</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const s = localStorage.getItem("homestead.color-scheme");
        const dark = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (_) {}
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
